name: xcash

volumes:
  redis_data: {}
  db_data: {}

# 同机 SaaS 等可信服务通过加入 xcash_public 按 DNS 别名互通（如 http://xcash-caddy）。
# xcash 自己总是创建该网络；即便没有外部服务加入也不影响本项目正常运行。
networks:
  default:
  xcash_public:
    name: xcash_public

services:
  redis:
    image: redis:8.2.1
    container_name: xcash_redis
    restart: unless-stopped
    # broker 与缓存共用 Redis 实例时不设置 maxmemory：Redis 内存策略是实例级的，
    # 内存超过上限后 broker 锁/队列写入也会被拒，导致 worker 无法启动。
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data

  db:
    image: postgres:18.4-trixie
    container_name: xcash_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: xcash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql

  migration-rehearsal-db:
    image: postgres:18.4-trixie
    container_name: xcash_migration_rehearsal_db
    profiles: ["migration-rehearsal"]
    environment:
      POSTGRES_DB: xcash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
      target: python-run-stage
    container_name: xcash_django
    restart: unless-stopped
    depends_on:
      - db
      - redis
    # 主环境文件含 WALLET_MNEMONIC_ENCRYPTION_KEY（钱包助记词加密密钥）。
    # 地址派生与 EVM 签名在主系统内部完成，worker/beat 经 anchor 继承同一份配置。
    env_file:
      - ${ENV_FILE:-.env}
    # django/worker/beat 都需要按 DNS 别名解析 saas 侧 Caddy：
    # django 同步校验 SaaS permission，worker 推送内部回调，beat 调度刷新任务。
    networks: [default, xcash_public]
    command: /start

  worker:
    <<: *django
    container_name: xcash_worker
    environment:
      REMAP_SIGTERM: SIGQUIT
    stop_grace_period: 60s
    command: /start-worker

  beat:
    <<: *django
    container_name: xcash_beat
    command: /start-beat

  caddy:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
      target: caddy-run-stage
    container_name: xcash_caddy
    restart: unless-stopped
    depends_on:
      - django
    ports:
      - "${LISTEN_TO:-127.0.0.1}:6688:80"
    # 对外（公网）走端口映射，对内（SaaS 同机调用）通过 xcash_public 网络按 DNS 别名直连。
    networks:
      default: {}
      xcash_public:
        aliases:
          - xcash-caddy
